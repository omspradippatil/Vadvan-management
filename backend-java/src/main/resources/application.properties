# Server Configuration
server.port=${PORT:5000}

# Database Connection (Reads from System Environment Variables or fallback to localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/vadhvan_port}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:vadhvan-secure-port-fleet-management-jwt-secret-key-32chars}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://vadvan-management.vercel.app}
